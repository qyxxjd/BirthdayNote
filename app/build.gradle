plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.classic.birthday'
    compileSdk compile_sdk_version
    defaultConfig {
        applicationId "com.classic.birthday"
        minSdk min_sdk_version
        targetSdk target_sdk_version
        versionCode 1
        versionName "1.0"

        sourceSets {
            androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        }
    }
    signingConfigs {
        Classic {
            storeFile file(uri("../tools/car.jks"))
            storePassword STORE_PASSWORD
            keyAlias KEY_ALIA
            keyPassword KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            versionNameSuffix "-debug"
            signingConfig signingConfigs.Classic
            project.gradle.startParameter.excludedTaskNames.add('lint')  // 屏蔽lint耗时检查
        }
        release {
            // 混淆
            minifyEnabled false
            // 移除无用的resource文件
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.Classic
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Room schema export location for KSP
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

// 重命名输出的 APK。AGP 9 移除了旧的 applicationVariants API，
// 改为通过 androidComponents.onVariants 监听 APK 产物并复制重命名。
androidComponents {
    onVariants(selector().all()) { variant ->
        def renameTask = tasks.register("renameApkFor${variant.name.capitalize()}", RenameApk) {
            it.output.set(layout.buildDirectory.dir("outputs/renamed_apks/${variant.name}"))
            it.builtArtifactsLoader.set(variant.artifacts.getBuiltArtifactsLoader())
        }
        variant.artifacts.use(renameTask)
                .wiredWith({ it.input })
                .toListenTo(com.android.build.api.artifact.SingleArtifact.APK.INSTANCE)
    }
}

abstract class RenameApk extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getInput()

    @OutputDirectory
    abstract DirectoryProperty getOutput()

    @Internal
    abstract Property<com.android.build.api.variant.BuiltArtifactsLoader> getBuiltArtifactsLoader()

    @TaskAction
    void taskAction() {
        def outputDir = output.get()
        def outputFile = outputDir.asFile
        outputFile.deleteDir()
        outputFile.mkdirs()

        def builtArtifacts = builtArtifactsLoader.get().load(input.get())
        if (builtArtifacts == null) {
            throw new RuntimeException("Cannot load APKs")
        }
        builtArtifacts.elements.each { artifact ->
            def name = "BirthdayNote_v${artifact.versionName}_${artifact.versionCode}_${builtArtifacts.variantName}.apk"
            java.nio.file.Files.copy(
                    new File(artifact.outputFile).toPath(),
                    outputDir.file(name).asFile.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        builtArtifacts.save(outputDir)
    }
}

dependencies {
    implementation project(path: ':core')
    implementation files('libs/wheel_view-1.1.aar')
    implementation files('libs/picker_view-1.1.aar')
    // Sqlite
    implementation "androidx.sqlite:sqlite-ktx:$sqlite_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // 图片相关
    // https://github.com/coil-kt/coil
    implementation "io.coil-kt:coil:$coil_version"
    // https://github.com/LuckSiege/PictureSelector
    implementation "io.github.lucksiege:pictureselector:${picture_version}"
    implementation "io.github.lucksiege:compress:${picture_version}"
    implementation "io.github.lucksiege:ucrop:${picture_version}"
    implementation "io.github.lucksiege:camerax:${picture_version}"

    // https://github.com/afkT/DevUtils
    implementation 'io.github.afkt:DevAppX:2.5.3'
}